services:
  db:
    image: postgres:18-alpine
    container_name: scriptbook-database-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: scriptbook-database-user
      POSTGRES_PASSWORD: scriptbook-database-password
      POSTGRES_DB: scriptbook-database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: